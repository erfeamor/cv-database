# Local development config. The dev-seeds location holds an afterMigrate
# callback with demo data — production configs must list only the
# migrations location.
# allowPublicKeyRetrieval: Flyway's bundled MariaDB driver connects without
# TLS and otherwise refuses MySQL 8's caching_sha2_password auth.
flyway.url=jdbc:mysql://localhost:3306/cv?allowPublicKeyRetrieval=true
flyway.user=cv
flyway.password=cv
flyway.locations=filesystem:/flyway/sql/migrations,filesystem:/flyway/sql/dev-seeds
flyway.baselineOnMigrate=true
