# Apply cv-database migrations to production (T-158).
#
# The gate (gate.yml, T-159) runs every migration against a throwaway MySQL 8.4
# first; the migrate job needs it. This workflow assumes a master-only OIDC
# role; no `environment:` anywhere, since that would change the OIDC sub claim
# the trust matches (ref:refs/heads/master). Runs only on a master push that
# touches sql/migrations/** (or this file), or a manual dispatch (master only).
name: migrate

on:
  push:
    branches: [master]
    paths:
      - 'sql/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Queue runs; never cancel one half-way through a Flyway migrate.
concurrency:
  group: migrate-cv-database
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  SSM_DOCUMENT: cv-redeploy-migrate
  TARGET_NAME_TAG: cv-project-domain-service
  PUBLIC_BASE_URL: https://erfeamor.com

jobs:
  # Throwaway-MySQL check of every migration (gate.yml, T-159); production is
  # touched only if it passes.
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml

  migrate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the master ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Production migrations run from refs/heads/master only (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Require the deploy role variable
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Repository variable AWS_DEPLOY_ROLE_ARN is not set; cannot assume the migrate role."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cv-database-migrate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # T-071: the app host cannot reach github.com once it has no public IPv4
      # (T-068), so cv_sync_database_repo (cv-infra, T-070) reads the sql/ tree
      # from S3. Publish exactly the tree of the commit being migrated, before
      # the SSM command that makes the host read it. This job only runs on
      # master (first step), after the gate.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish sql/ to S3
        env:
          SQL_URI: ${{ vars.MIGRATION_SQL_S3_URI }}
        run: |
          set -euo pipefail
          # Same key the host reads (cv-infra local.migration_sql_key); the
          # role can write nothing else.
          if ! [[ "${SQL_URI}" =~ ^s3://([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])/(migrations/cv-database-sql\.tgz)$ ]]; then
            echo "::error::Repository variable MIGRATION_SQL_S3_URI must be s3://<bucket>/migrations/cv-database-sql.tgz (cv-infra output migration_sql_bucket)."
            exit 1
          fi
          bucket="${BASH_REMATCH[1]}"
          key="${BASH_REMATCH[2]}"
          # Reproducible: same sql/ tree, same bytes.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -cf - sql | gzip -n > "${RUNNER_TEMP}/cv-database-sql.tgz"
          tar -tzf "${RUNNER_TEMP}/cv-database-sql.tgz" | grep -qx 'sql/migrations/' || { echo "::error::sql/migrations missing from the archive."; exit 1; }
          aws s3 cp "${RUNNER_TEMP}/cv-database-sql.tgz" "s3://${bucket}/${key}" --only-show-errors
          # No read-back: the role has PutObject on this key and nothing else.
          echo "Published ${GITHUB_SHA::7} sql/ to s3://${bucket}/${key} ($(stat -c %s "${RUNNER_TEMP}/cv-database-sql.tgz") bytes)"

      - name: Migrate production (SSM)
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --document-name "${SSM_DOCUMENT}" \
            --targets "Key=tag:Name,Values=${TARGET_NAME_TAG}" \
            --comment "cv-database migrate ${GITHUB_SHA::7}" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: ${command_id}"

          # Flyway may pull its image on the host; the document's own timeout
          # is 600 s, so allow ~10 minutes here.
          deadline=$(( $(date +%s) + 10 * 60 ))
          while :; do
            invocations=$(aws ssm list-command-invocations \
              --command-id "${command_id}" --details --output json)
            count=$(jq '.CommandInvocations | length' <<<"$invocations")
            status=$(jq -r '.CommandInvocations[0].Status // "none"' <<<"$invocations")
            echo "$(date -u +%H:%M:%S) invocations=${count} status=${status}"
            if [ "$count" -gt 1 ]; then
              echo "::error::Expected exactly one target instance, got ${count}."
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              case "$status" in
                Pending|InProgress|Delayed|Cancelling) ;;
                *) break ;;
              esac
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::SSM command ${command_id} did not finish within 10 minutes (invocations=${count}, status=${status})."
              exit 1
            fi
            sleep 10
          done

          echo "--- invocation output (tail) ---"
          jq -r '.CommandInvocations[0].CommandPlugins[]?.Output // empty' <<<"$invocations" | tail -n 30
          echo "--------------------------------"
          if [ "$status" != "Success" ]; then
            echo "::error::SSM migrate finished with status ${status}."
            exit 1
          fi

      - name: Smoke check
        run: |
          set -euo pipefail
          # Migrations are additive: the running domain service must still answer.
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null \
            "${PUBLIC_BASE_URL}/bff/api/v1/people/1/cv"
          echo "BFF aggregate: 200"
