# Apply cv-database migrations to production (T-158).
#
# Jenkins (Jenkinsfile) is this repo's CI gate: it runs every migration against
# a throwaway MySQL 8.4. Production migrations run here, not in Jenkins, because
# no deploy credential may live on the CI host (T-005). This workflow assumes a
# master-only OIDC role and migrates a commit only after Jenkins has reported
# `success` for that same commit. Runs only on a master push that touches
# sql/migrations/** (or this file), or a manual dispatch (master only).
name: migrate

on:
  push:
    branches: [master]
    paths:
      - 'sql/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  statuses: read

# Queue runs; never cancel one half-way through a Flyway migrate.
concurrency:
  group: migrate-cv-database
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  SSM_DOCUMENT: cv-redeploy-migrate
  TARGET_NAME_TAG: cv-project-domain-service
  JENKINS_CONTEXT: continuous-integration/jenkins/branch
  PUBLIC_BASE_URL: https://dvdlxl0zqepqi.cloudfront.net

jobs:
  wait-for-jenkins:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require the master ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Production migrations run from refs/heads/master only (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Wait for a green Jenkins status on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The CI host is on-demand: a doorbell wakes it on push, it boots,
          # then Jenkins scans, so the status can take several minutes to
          # appear. Bounded at 30 minutes.
          deadline=$(( $(date +%s) + 30 * 60 ))
          while :; do
            # Statuses are listed newest first; the first entry with our
            # context is the current state for it.
            state=$(gh api "repos/${REPO}/commits/${SHA}/statuses?per_page=100" \
              --jq "[.[] | select(.context == \"${JENKINS_CONTEXT}\")][0].state // \"absent\"" \
              || echo "api-error")
            echo "$(date -u +%H:%M:%S) ${JENKINS_CONTEXT}: ${state}"
            case "$state" in
              success)
                echo "Jenkins is green; migrating."
                exit 0 ;;
              failure|error)
                echo "::error::Jenkins is red (${state}); not migrating."
                exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No green Jenkins status for ${SHA} after 30 minutes (last: ${state}); not migrating."
              exit 1
            fi
            sleep 20
          done

  migrate:
    needs: wait-for-jenkins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the master ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Production migrations run from refs/heads/master only (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Require the deploy role variable
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Repository variable AWS_DEPLOY_ROLE_ARN is not set; cannot assume the migrate role."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cv-database-migrate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Migrate production (SSM)
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --document-name "${SSM_DOCUMENT}" \
            --targets "Key=tag:Name,Values=${TARGET_NAME_TAG}" \
            --comment "cv-database migrate ${GITHUB_SHA::7}" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: ${command_id}"

          # Flyway may pull its image on the host; the document's own timeout
          # is 600 s, so allow ~10 minutes here.
          deadline=$(( $(date +%s) + 10 * 60 ))
          while :; do
            invocations=$(aws ssm list-command-invocations \
              --command-id "${command_id}" --details --output json)
            count=$(jq '.CommandInvocations | length' <<<"$invocations")
            status=$(jq -r '.CommandInvocations[0].Status // "none"' <<<"$invocations")
            echo "$(date -u +%H:%M:%S) invocations=${count} status=${status}"
            if [ "$count" -gt 1 ]; then
              echo "::error::Expected exactly one target instance, got ${count}."
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              case "$status" in
                Pending|InProgress|Delayed|Cancelling) ;;
                *) break ;;
              esac
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::SSM command ${command_id} did not finish within 10 minutes (invocations=${count}, status=${status})."
              exit 1
            fi
            sleep 10
          done

          echo "--- invocation output (tail) ---"
          jq -r '.CommandInvocations[0].CommandPlugins[]?.Output // empty' <<<"$invocations" | tail -n 30
          echo "--------------------------------"
          if [ "$status" != "Success" ]; then
            echo "::error::SSM migrate finished with status ${status}."
            exit 1
          fi

      - name: Smoke check
        run: |
          set -euo pipefail
          # Migrations are additive: the running domain service must still answer.
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null \
            "${PUBLIC_BASE_URL}/bff/api/v1/people/1/cv"
          echo "BFF aggregate: 200"
