services:
  mysql:
    image: mysql:8.4
    container_name: cv-database
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cv
      MYSQL_USER: cv
      MYSQL_PASSWORD: cv
    ports:
      - "3306:3306"
    volumes:
      - cv-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cv-mysql-data:
